apiVersion: v1
kind: ConfigMap
metadata:
  name: my-config
data:
  app.properties: |
    key1=value1
    key2=value2

---

apiVersion: v1
kind: Pod
metadata:
  name: configmap-example
spec:
  containers:
  - name: app-container
    image: busybox
    command: 
      - "/bin/sh"
      - "-c"
      - "cat /config/app.properties"
      - "sleep 3600"
    volumeMounts:
    - mountPath: /config
      name: config-volume
  volumes:
  - name: config-volume
    configMap:
      name: my-config